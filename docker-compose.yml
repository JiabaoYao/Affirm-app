services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` so Postgres is reachable only from the api container, never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Served under /api by the web container, so Swagger lives at /api/docs.
      ROOT_PATH: /api
    depends_on:
      db:
        condition: service_healthy
    # Published only for direct Swagger/Postman access; the browser app goes through the web container.
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
